<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ARO — Responsive visual review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ded8cc;color:#282420;font:14px system-ui,sans-serif}header{padding:18px 24px;background:#fffcf6;border-bottom:1px solid #b6ad9c}h1{font-size:20px;margin:0 0 8px}p{margin:0 0 12px;line-height:1.5}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,a{min-height:44px;padding:11px 15px;border:1px solid #c4b9a7;border-radius:8px;background:#fff;color:#282420;text-decoration:none;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#282420;color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #b9331d;outline-offset:3px}main{padding:20px;overflow:auto}iframe{display:block;margin:0 auto;width:390px;height:844px;border:0;background:#f6f0e6;border-radius:16px;box-shadow:0 10px 40px #28242022}output{font-size:12px;margin-left:8px}
</style>
</head>
<body>
<header><h1>ARO · Responsive visual review</h1><p>Live interactive pages at exact CSS widths. This checks layout, not native iOS or Android behavior. Preview changes stay inside this visit.</p><nav aria-label="Preview width"><button data-width="320" aria-pressed="false">320 px</button><button data-width="360" aria-pressed="false">360 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430" aria-pressed="false">430 px</button><button data-width="768" aria-pressed="false">768 px</button><button data-width="1440" aria-pressed="false">1440 px</button><a href="/app/personalize" target="_blank" rel="noopener">Open full preview ↗</a><output aria-live="polite">390 × 844 CSS pixels</output></nav><label>Page <select id="route" style="min-height:44px;margin-top:12px;font:inherit"><option value="/app/personalize/season">Season</option><option value="/app">Home</option><option value="/app/messages">Messages</option><option value="/app/saved">Saved</option><option value="/app/personalize">Your World</option><option value="/app/world">Explore</option><option value="/app/opportunities/shared-stories">Opportunity</option><option value="/app/opportunities/shared-stories/commit">Commitment</option><option value="/app/circles/shared-stories">Circle</option><option value="/app/create">Create</option><option value="/app/personalize/character">Character</option><option value="/app/personalize/shop">Shop</option><option value="/app/personalize/space">My Space</option></select></label></header>
<main><iframe id="preview" src="/app/personalize/season" title="ARO experience preview"></iframe></main>
<script>
const preview=document.getElementById('preview');
document.getElementById('route').addEventListener('change',event=>{preview.src=event.target.value;});
for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{
 const width=Number(button.dataset.width);preview.style.width=width+'px';
 for(const choice of document.querySelectorAll('[data-width]'))choice.setAttribute('aria-pressed',String(choice===button));
 document.querySelector('output').textContent=width+' × 844 CSS pixels';
});
</script>
</body></html>
