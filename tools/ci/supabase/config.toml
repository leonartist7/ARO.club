# CI-only platform fixture. Not the application migration workdir.
project_id = "aro-i0-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "api"]
extra_search_path = ["public", "extensions"]
max_rows = 100
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 0
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
# Synthetic signup tests do not prove hosted email deliverability.
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"

[edge_runtime]
enabled = false

[analytics]
enabled = false
