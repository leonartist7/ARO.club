name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tools/autonomy/core.test.mjs
      - run: npm run lint -- --max-warnings=0
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test -- src/views/AppDiscovery.test.jsx src/views/AppPersonal.test.jsx src/views/AppReturn.test.jsx
        env:
          FV1_BROWSER_EVIDENCE: 'true'
      - name: RB7 preferences browser regression
        run: node scripts/verify-rb7.mjs
      - name: Retain RB7 synthetic preferences evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb7-preferences
          path: artifacts/ARO-RB7/cloud-continuation
          retention-days: 7
      - run: npm run test:e2e
