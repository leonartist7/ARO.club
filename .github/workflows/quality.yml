name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tools/autonomy/core.test.mjs
      - run: node --test scripts/compare-cb1-f4-performance.test.mjs
      - run: npm run lint -- --max-warnings=0
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Clear checked-in RB16 output before verification
        run: |
          node -e "require('node:fs').rmSync('artifacts/ARO-RB16/after', { recursive: true, force: true })"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Circle Builder guide web exports
        run: node scripts/export-cb1-guides.mjs
        env:
          ARO_CB1_EXPORT_RECEIPTS: 'false'
      - name: Retain Circle Builder guide web exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb1-guide-exports
          path: artifacts/ARO-CB1-P/exports
          if-no-files-found: error
          retention-days: 14
      - name: Circle Builder compact artwork review
        run: node scripts/review-cb1-art.mjs
      - name: Retain Circle Builder compact artwork review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb1-guide-art-review
          path: artifacts/ARO-CB1-P/art-review
          if-no-files-found: error
          retention-days: 14
      - name: Circle Builder Create measurement
        run: node scripts/measure-cb1-create.mjs
        env:
          ARO_CB1_GUIDED_CREATE: 'true'
      - name: Retain Circle Builder baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb1-create-baseline
          path: artifacts/ARO-CB1-P/baseline
          if-no-files-found: error
          retention-days: 14
      - name: Circle Builder Choose and Shape isolation checks
        run: node scripts/verify-cb1-f2.mjs
        env:
          ARO_CB1_F2_RECEIPTS: 'false'
      - name: Retain Circle Builder Choose and Shape evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb1-f2-isolation
          path: artifacts/ARO-CB1-F2/browser
          if-no-files-found: error
          retention-days: 14
      - name: Circle Builder Details and Review isolation checks
        run: node scripts/verify-cb1-f3.mjs
      - name: Circle Builder connected route checks
        run: node scripts/verify-cb1-f4.mjs
      - name: Retain Circle Builder connected route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb1-f4-route
          path: artifacts/ARO-CB1-F4/browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain Circle Builder Details and Review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb1-f3-isolation
          path: artifacts/ARO-CB1-F3/browser
          if-no-files-found: error
          retention-days: 14
      - name: RB13 compact footer browser check
        run: node scripts/verify-rb13-footer.mjs
      - name: Retain RB13 footer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb13-footer
          path: artifacts/ARO-RB13/footer
          retention-days: 7
      - name: RB16 visual coherence browser check
        run: node scripts/verify-rb16.mjs
      - name: Retain RB16 visual coherence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb16-visual-coherence
          path: artifacts/ARO-RB16/after
          if-no-files-found: error
          retention-days: 7
      - run: npm test -- src/views/AppDiscovery.test.jsx src/views/AppPersonal.test.jsx src/views/AppReturn.test.jsx
        env:
          FV1_BROWSER_EVIDENCE: 'true'
      - name: RB7 preferences browser regression
        run: node scripts/verify-rb7.mjs
      - name: Retain RB7 synthetic preferences evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb7-preferences
          path: artifacts/ARO-RB7/cloud-continuation
          retention-days: 7
      - run: npm run test:e2e

  english-light-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_ARO_RELEASE_SCOPE: english-light
      - run: node scripts/verify-rb11.mjs
      - name: Retain release-scope screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb11-english-light
          path: artifacts/ARO-RB11/hosted
          retention-days: 7

  public-website-redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_ARO_RELEASE_SCOPE: english-light
      - run: node scripts/verify-rb12.mjs
      - name: Retain public website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb12-public-website
          path: artifacts/ARO-RB12/hosted
          retention-days: 7

  cb1-f4-performance:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/cb1-f4-integration-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Measure connected Create with all raw samples
        run: node scripts/measure-cb1-create.mjs
        env:
          ARO_CB1_GUIDED_CREATE: 'true'
      - name: Retain current measurements before baseline build
        run: |
          mkdir -p artifacts/ARO-CB1-F4/performance/current
          cp artifacts/ARO-CB1-P/baseline/*.json artifacts/ARO-CB1-F4/performance/current/
      - uses: actions/checkout@v4
        with:
          ref: f7adc10a40fa5388b8b1956bd80160b7f72cc990
          path: .cb1-f4-baseline
          persist-credentials: false
      - name: Same harness and dependency lock for immutable baseline
        run: |
          cmp package-lock.json .cb1-f4-baseline/package-lock.json
          cp scripts/measure-cb1-create.mjs .cb1-f4-baseline/scripts/measure-cb1-create.mjs
      - run: npm ci
        working-directory: .cb1-f4-baseline
      - run: npm run build
        working-directory: .cb1-f4-baseline
      - name: Measure unchanged Create on same runner and browser
        run: node scripts/measure-cb1-create.mjs
        working-directory: .cb1-f4-baseline
        env:
          GITHUB_SHA: f7adc10a40fa5388b8b1956bd80160b7f72cc990
          ARO_CB1_GUIDED_CREATE: 'false'
      - name: Enforce every unchanged absolute and paired performance budget
        run: |
          mkdir -p artifacts/ARO-CB1-F4/performance/baseline
          cp .cb1-f4-baseline/artifacts/ARO-CB1-P/baseline/*.json artifacts/ARO-CB1-F4/performance/baseline/
          node scripts/compare-cb1-f4-performance.mjs artifacts/ARO-CB1-F4/performance/baseline/baseline.json artifacts/ARO-CB1-F4/performance/current/baseline.json artifacts/ARO-CB1-F4/performance/comparison.json
      - name: Retain paired evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb1-f4-paired-performance
          path: artifacts/ARO-CB1-F4/performance
          if-no-files-found: error
          retention-days: 14
